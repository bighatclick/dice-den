# A12 Daily reminder (F13): Android 13+ asks for the notification permission only when the
# player turns the reminder on; Allow enables it with a time picker; Deny explains.
appId: com.dicedengame.app
name: A12 daily reminder permission
tags: [release, core, android]
---
# Allow path.
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- tapOn: "Skip"
- tapOn: "Settings"
- scrollUntilVisible: { element: { text: "Daily reminder" } }
- assertVisible: { text: "Daily reminder", checked: false }
- tapOn: "Daily reminder"
- extendedWaitUntil:
    visible: "(?i)^allow$"
    timeout: 5000
- tapOn: "(?i)^allow$"
- assertVisible: { text: "Daily reminder", checked: true }
- scrollUntilVisible: { element: { text: "Reminder time" } }
- scrollUntilVisible: { element: { text: "8:00.*" } }
- tapOn: "8:00.*"
- assertVisible: { text: "8:00.*", selected: true }
- tapOn: "Daily reminder"
- assertVisible: { text: "Daily reminder", checked: false }
- assertNotVisible: "Reminder time"
# Deny path on a fresh install.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- tapOn: "Skip"
- tapOn: "Settings"
- scrollUntilVisible: { element: { text: "Daily reminder" } }
- tapOn: "Daily reminder"
- runFlow:
    when:
      visible: "(?i)don.t allow"
    commands:
      - tapOn: "(?i)don.t allow"
- scrollUntilVisible: { element: { text: "Notifications are off for Dice Den.*" } }
- assertVisible: { text: "Daily reminder", checked: false }
