# A19 Largest system font size (the runner sets font_scale 2.0): every screen stays usable,
# the pad goes to one column, and a whole turn can be played.
appId: com.dicedengame.app
name: A19 large text
tags: [visual, fontscale]
---
- runFlow: subflows/fresh-start.yaml
- takeScreenshot: a19-home-200
- tapOn: "Play"
- takeScreenshot: a19-new-game-200
- tapOn: "vs Computer"
- tapOn: "Expert"
- tapOn: "Start game"
- takeScreenshot: a19-table-200
- tapOn: { id: "roll-button" }
- tapOn: { id: "die-0" }
- assertVisible: "HELD"
# At 2.0 the pad is one long column; swipe over the pad itself until Chance is on screen.
- repeat:
    times: 8
    while: { notVisible: { id: "box-chance" } }
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 35%", duration: 400 }
- tapOn: { id: "box-chance" }
# Let the computer finish on its own: tapping Skip races the button turning into Roll.
- extendedWaitUntil: { visible: "Turn 2 · Ready to roll", timeout: 40000 }
- back
- tapOn: "(?i)^leave$"
- scrollUntilVisible: { element: { text: "Resume game, Turn 2 of 13" } }
- takeScreenshot: a19-home-resume-200
- scrollUntilVisible: { element: { text: "Settings" }, direction: UP }
- tapOn: "Settings"
- takeScreenshot: a19-settings-200
- back
- scrollUntilVisible: { element: { text: "Stats" } }
- tapOn: "Stats"
- takeScreenshot: a19-stats-200
- back
- scrollUntilVisible: { element: { text: "Today's dice.*" } }
- tapOn: "Today's dice.*"
- takeScreenshot: a19-daily-200
