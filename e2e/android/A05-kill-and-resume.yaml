# A05 Never lose progress (CLAUDE.md rule 3): force-stop mid-turn, mid-computer-turn and
# with settings changed; everything comes back exactly.
appId: com.dicedengame.app
name: A05 force-stop and resume
tags: [release, core, android]
---
- runFlow: subflows/fresh-start.yaml
- tapOn: "Settings"
- tapOn: "Dark"
- tapOn: "Large dice"
- back
- tapOn: "Play"
- tapOn: "vs Computer"
- tapOn: "Normal"
- tapOn: "Start game"
- tapOn: { id: "roll-button" }
- tapOn: { id: "die-3" }
- tapOn: { id: "roll-button" }
- tapOn: { id: "die-0" }
- assertVisible: "Turn 1 · Roll 2 of 3"
# Android force-stop, as "swipe away in Recents" does.
- killApp
- launchApp
- assertVisible: "Resume game, Turn 1 of 13"
- assertVisible: 'Computer \(Normal\)'
- tapOn: "Resume game.*"
- assertVisible: "Turn 1 · Roll 2 of 3"
- assertVisible: "Die 1, showing [1-6], held"
- assertVisible: "Die 4, showing [1-6], held"
- assertVisible: "Die 2, showing [1-6]"
- assertNotVisible: "Die 2, showing [1-6], held"
# Score, let the computer start, then kill it mid-turn.
- scrollUntilVisible: { element: { id: "box-chance" } }
- tapOn: { id: "box-chance" }
- assertVisible: 'Computer \(Normal\) is playing'
- extendedWaitUntil:
    visible: "Turn 1 · Roll [1-3] of 3"
    timeout: 8000
- killApp
- launchApp
- tapOn: "Resume game.*"
# The computer carries on from where it was (or has already finished) and the turn comes back to the person.
- extendedWaitUntil:
    visible: "Turn 2 · Ready to roll"
    timeout: 20000
- assertVisible: "Chance, scored [0-9]+"
- assertVisible: 'Computer \(Normal\), [1-9][0-9]* points'
# Settings survived too.
- back
- tapOn: "(?i)^leave$"
- runFlow: subflows/to-home.yaml
- tapOn: "Settings"
- assertVisible: { text: "Dark", selected: true }
- assertVisible: { text: "Large dice", checked: true }
