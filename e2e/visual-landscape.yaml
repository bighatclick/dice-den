# I16 Landscape: the score grid shows beside the dice, handoff covers the table.
appId: com.dicedengame.app
name: I16 landscape
---
- runFlow: subflows/fresh-start.yaml
- tapOn: "Pass and play.*"
- scrollUntilVisible: { element: { text: "Start game" } }
- tapOn: "Start game"
- setOrientation: LANDSCAPE_LEFT
- takeScreenshot: i16-table-landscape
- tapOn: { id: "roll-button" }
- tapOn: { id: "grid-ones" }
- assertVisible: "Pass the phone to"
- takeScreenshot: i16-handoff-landscape
- scrollUntilVisible: { element: { text: "Start Player 2's turn" } }
- tapOn: "Start Player 2's turn"
- assertVisible: "Player 2, 0 points, playing now"
- setOrientation: PORTRAIT
- assertVisible: "Player 2, 0 points, playing now"
