# Cheap checks run on every push (Linux, 1x minutes). The iOS build runs on Expo's servers and the
# simulator tests on a macOS runner (10x minutes on a private repo), so both are manual only.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Run the iOS Maestro flows on a macOS simulator
        type: boolean
        default: false
      build_id:
        description: EAS simulator build id to test. Leave empty to build a new one first.
        type: string
        default: ''

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  ios-build:
    if: github.event_name == 'workflow_dispatch' && inputs.ios && inputs.build_id == ''
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build the simulator app on EAS
        id: build
        run: |
          eas build --platform ios --profile simulator --non-interactive --wait --json > build.json
          echo "id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json'))[0].id)")" >> "$GITHUB_OUTPUT"

  ios-test:
    # Runs when a build id was given, or after the build job made one.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.ios && (inputs.build_id != '' || needs.ios-build.result == 'success') }}
    needs: ios-build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUILD_ID: ${{ inputs.build_id != '' && inputs.build_id || needs.ios-build.outputs.build_id }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the simulator app from EAS
        run: |
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > build.json
          url=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json')).artifacts.buildUrl)")
          mkdir app && curl -sL "$url" | tar -xz -C app
          find app -maxdepth 2 -name '*.app'
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot a simulator and install the app
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b
          xcrun simctl install booted "$(find app -maxdepth 2 -name '*.app' | head -1)"
      # The monetized flows (shop, remove-ads, interstitial) need a build with ads and the fake
      # store switched on; this build has them off, so they are not run.
      - name: Run the iOS flows
        run: |
          maestro test --format junit --output maestro-report.xml \
            e2e/onboarding.yaml e2e/full-game.yaml e2e/holds-rolls-undo.yaml e2e/resume.yaml \
            e2e/vs-computer.yaml e2e/pass-and-play.yaml e2e/scandinavian-forced-order.yaml e2e/daily.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: maestro-report.xml
